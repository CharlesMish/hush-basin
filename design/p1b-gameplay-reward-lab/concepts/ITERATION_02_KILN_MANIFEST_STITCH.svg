<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>District Zero Iteration 02 — Kiln Manifest paint and Manifest Stitch trail concept</title>
  <defs>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263038"/>
      <stop offset="1" stop-color="#13191e"/>
    </linearGradient>
    <linearGradient id="ceramic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8cfbf"/>
      <stop offset="1" stop-color="#9e9588"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#0d1115"/>
  <rect x="28" y="28" width="1144" height="664" rx="20" fill="#151b20" stroke="#363f46" stroke-width="2"/>
  <text x="60" y="72" fill="#f1eee8" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">KILN MANIFEST</text>
  <text x="60" y="101" fill="#aa9ad1" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="2">ITERATION 02 · INTEGRITY STUDY · CONCEPT ONLY</text>

  <rect x="60" y="130" width="720" height="510" rx="16" fill="url(#road)" stroke="#4a555e"/>
  <path d="M 80 567 C 232 480, 291 470, 390 492 C 517 520, 602 431, 753 326" fill="none" stroke="#3f4e56" stroke-width="154" stroke-linecap="round" opacity="0.95"/>
  <path d="M 80 567 C 232 480, 291 470, 390 492 C 517 520, 602 431, 753 326" fill="none" stroke="#596871" stroke-width="3" stroke-dasharray="12 18" opacity="0.45"/>

  <!-- Manifest Stitch: alternating parcel-seam kites along completed path. -->
  <g fill="#b8a7dd" stroke="#d8cfec" stroke-width="1.2" opacity="0.72">
    <path d="M116 552 l9 -5 l9 5 l-9 5 z"/>
    <path d="M159 526 l9 -5 l9 5 l-9 5 z" fill="#b4bcc3" stroke="#e0e5e8"/>
    <path d="M205 506 l9 -5 l9 5 l-9 5 z"/>
    <path d="M252 494 l9 -5 l9 5 l-9 5 z" fill="#b4bcc3" stroke="#e0e5e8"/>
    <path d="M302 493 l9 -5 l9 5 l-9 5 z"/>
    <path d="M354 503 l9 -5 l9 5 l-9 5 z" fill="#b4bcc3" stroke="#e0e5e8"/>
    <path d="M405 504 l9 -5 l9 5 l-9 5 z"/>
    <path d="M458 490 l9 -5 l9 5 l-9 5 z" fill="#b4bcc3" stroke="#e0e5e8"/>
    <path d="M508 466 l9 -5 l9 5 l-9 5 z"/>
    <path d="M553 438 l9 -5 l9 5 l-9 5 z" fill="#b4bcc3" stroke="#e0e5e8"/>
  </g>

  <!-- Stylized top view of R7 material-role concept, not replacement geometry. -->
  <g transform="translate(605 374) rotate(-38)">
    <ellipse cx="0" cy="25" rx="108" ry="72" fill="#080b0d" opacity="0.55"/>
    <path d="M-78 15 L-116 -65 L-61 -85 L-20 -18 Z" fill="url(#ceramic)" stroke="#aa9ad1" stroke-width="5"/>
    <path d="M78 15 L116 -65 L61 -85 L20 -18 Z" fill="url(#ceramic)" stroke="#aa9ad1" stroke-width="5"/>
    <path d="M-72 32 L-91 98 L-36 105 L-15 30 Z" fill="#3c3849" stroke="#aa9ad1" stroke-width="4"/>
    <path d="M72 32 L91 98 L36 105 L15 30 Z" fill="#3c3849" stroke="#aa9ad1" stroke-width="4"/>
    <path d="M-43 -24 L-23 -70 L23 -70 L43 -24 L31 72 L-31 72 Z" fill="#5e5855" stroke="#211f24" stroke-width="12"/>
    <path d="M-27 -55 L0 -81 L27 -55 L22 18 L-22 18 Z" fill="#686171"/>
    <path d="M-21 16 L0 -7 L21 16 L17 57 L-17 57 Z" fill="#211f24"/>
    <circle cx="0" cy="8" r="13" fill="#4ff7e8" filter="url(#softGlow)"/>
    <circle cx="0" cy="8" r="5" fill="#e9ffff"/>
    <path d="M-34 -22 L-50 18 M34 -22 L50 18 M-23 71 L-50 88 M23 71 L50 88" fill="none" stroke="#aa9ad1" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="88" y="611" fill="#d3dae0" font-family="Inter, Arial, sans-serif" font-size="14">Alternating world-distance stitches trace the completed path — never route guidance or condition state.</text>

  <g transform="translate(818 136)" font-family="Inter, Arial, sans-serif">
    <text x="0" y="0" fill="#f1eee8" font-size="20" font-weight="700">PAINT ROLES</text>
    <g transform="translate(0 28)" font-size="14">
      <rect width="42" height="28" rx="5" fill="#211f24"/><text x="56" y="20" fill="#d8dde0">Frame · carbon</text>
      <rect y="40" width="42" height="28" rx="5" fill="#5e5855"/><text x="56" y="60" fill="#d8dde0">Shell · basalt taupe</text>
      <rect y="80" width="42" height="28" rx="5" fill="#c8bdab"/><text x="56" y="100" fill="#d8dde0">Lift · warm ceramic</text>
      <rect y="120" width="42" height="28" rx="5" fill="#3c3849"/><text x="56" y="140" fill="#d8dde0">Underlay · graphite violet</text>
      <rect y="160" width="42" height="28" rx="5" fill="#aa9ad1"/><text x="56" y="180" fill="#d8dde0">Trim · inspection violet</text>
      <rect y="200" width="42" height="28" rx="5" fill="#686171"/><text x="56" y="220" fill="#d8dde0">Drive can · plum gunmetal</text>
    </g>

    <text x="0" y="288" fill="#f1eee8" font-size="20" font-weight="700">MANIFEST STITCH</text>
    <text x="0" y="318" fill="#b8a7dd" font-size="14">16 preallocated kite marks maximum</text>
    <text x="0" y="342" fill="#d8dde0" font-size="14">1.05 m spacing · 0.52 s history</text>
    <text x="0" y="366" fill="#d8dde0" font-size="14">alpha ≤ 0.48 · depth-tested</text>
    <text x="0" y="390" fill="#d8dde0" font-size="14">reduced motion: 7 marks · 0.24 s</text>

    <rect x="0" y="426" width="314" height="91" rx="10" fill="#211f24" stroke="#5b526f"/>
    <text x="16" y="452" fill="#f0dca7" font-size="13" font-weight="700">PRESENTATION-ONLY BOUNDARY</text>
    <text x="16" y="476" fill="#cbd1d5" font-size="12">No collision · no integrity input · no payout</text>
    <text x="16" y="497" fill="#cbd1d5" font-size="12">Energy, nozzle, bore and strike cues stay fixed.</text>
  </g>

  <text x="60" y="674" fill="#7f8991" font-family="Inter, Arial, sans-serif" font-size="12">Research candidate only · native cue, occlusion, comfort and performance review still required · R7 unchanged</text>
</svg>
