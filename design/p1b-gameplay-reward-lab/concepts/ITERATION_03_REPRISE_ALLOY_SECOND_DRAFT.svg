  <!-- Results hierarchy mockup. -->
  <g transform="translate(744 128)" font-family="Inter,Arial,sans-serif">
    <rect width="398" height="526" rx="15" fill="#171b27" stroke="#5d6481"/>
    <text x="24" y="43" fill="#eef0f6" font-size="15" letter-spacing="1.5">DELIVERED · GRADE A</text>
    <text x="24" y="89" fill="#f0d98e" font-size="34" font-weight="700">96 CREDITS</text>
    <text x="374" y="86" text-anchor="end" fill="#aeb4c8" font-size="13">BALANCE 164</text>
    <line x1="24" y1="111" x2="374" y2="111" stroke="#3b4154"/>
    <text x="24" y="142" fill="#d7d9e2" font-size="15">DELIVERY</text><text x="374" y="142" text-anchor="end" fill="#f1f2f5" font-size="15">+50</text>
    <text x="24" y="174" fill="#d7d9e2" font-size="15">CONDITION 92% · 1 EPISODE</text><text x="374" y="174" text-anchor="end" fill="#f1f2f5" font-size="15">+32</text>
    <text x="24" y="206" fill="#d7d9e2" font-size="15">PACE 1:42 · REF 1:35</text><text x="374" y="206" text-anchor="end" fill="#f1f2f5" font-size="15">+14</text>
    <rect x="24" y="230" width="350" height="39" rx="7" fill="#242a3b"/>
    <text x="40" y="255" fill="#d4c0dc" font-size="14" font-weight="700">NEW SESSION BEST RECEIPT</text>
    <rect x="24" y="293" width="350" height="54" rx="8" fill="#ddd2e5"/>
    <text x="199" y="326" text-anchor="middle" fill="#171a29" font-size="15" font-weight="700">CONTINUE AT DEP</text>
    <rect x="24" y="358" width="350" height="54" rx="8" fill="#252b3c" stroke="#7d83a0"/>
    <text x="199" y="391" text-anchor="middle" fill="#e0e2eb" font-size="15" font-weight="700">RESTART AT MRK</text>
    <text x="199" y="431" text-anchor="middle" fill="#9fa5bb" font-size="12">Relocates craft · completed reward remains</text>
    <text x="24" y="473" fill="#b9c3d8" font-size="13">Run details  ›</text>
    <text x="24" y="505" fill="#777f96" font-size="11">Grade explains the same condition + pace evidence.</text>
