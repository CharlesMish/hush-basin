<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>District Zero Iteration 03 — Reprise Alloy, Second Draft, and results hierarchy concept</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111520"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#31394b"/>
      <stop offset="1" stop-color="#1e2330"/>
