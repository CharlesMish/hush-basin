    <linearGradient id="lift" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4c8dc"/>
      <stop offset="1" stop-color="#8188aa"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="26" y="26" width="1148" height="668" rx="20" fill="none" stroke="#444b63" stroke-width="2"/>
  <text x="58" y="70" fill="#f1eff5" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700">REPRISE ALLOY · SECOND DRAFT</text>
  <text x="58" y="98" fill="#b8acd4" font-family="Inter,Arial,sans-serif" font-size="14" letter-spacing="2">ITERATION 03 · PACE / GRADE / RETRY STUDY · CONCEPT ONLY</text>

  <!-- Current-path trail study. The two strokes are deliberately asymmetric. -->
  <rect x="58" y="128" width="654" height="526" rx="15" fill="url(#road)" stroke="#525a70"/>
  <path d="M83 572 C176 526, 224 491, 307 504 C415 521, 479 451, 528 379 C568 321, 628 285, 689 276"
