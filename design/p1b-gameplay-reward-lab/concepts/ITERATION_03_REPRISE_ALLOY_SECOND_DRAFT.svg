  <text x="82" y="624" fill="#c8ccda" font-family="Inter,Arial,sans-serif" font-size="13">Both strokes contain only the current path. Neither is a prior run, target line, or pace delta.</text>

  <!-- Stylized role preview, not replacement geometry. -->
  <g transform="translate(541 361) rotate(-35)">
    <ellipse cx="0" cy="30" rx="102" ry="67" fill="#080a0f" opacity="0.55"/>
    <path d="M-76 14 L-112 -63 L-60 -83 L-18 -18 Z" fill="url(#lift)" stroke="#ddd2e5" stroke-width="5"/>
    <path d="M76 14 L112 -63 L60 -83 L18 -18 Z" fill="url(#lift)" stroke="#ddd2e5" stroke-width="5"/>
    <path d="M-69 31 L-88 95 L-34 101 L-14 29 Z" fill="#332b42" stroke="#ddd2e5" stroke-width="4"/>
    <path d="M69 31 L88 95 L34 101 L14 29 Z" fill="#332b42" stroke="#ddd2e5" stroke-width="4"/>
    <path d="M-42 -24 L-22 -69 L22 -69 L42 -24 L30 70 L-30 70 Z" fill="#434a68" stroke="#171a29" stroke-width="12"/>
    <path d="M-27 -54 L0 -80 L27 -54 L21 16 L-21 16 Z" fill="#615a7a"/>
    <path d="M-20 15 L0 -7 L20 15 L16 55 L-16 55 Z" fill="#171a29"/>
    <circle cx="0" cy="7" r="12" fill="#4ff7e8" filter="url(#glow)"/>
    <circle cx="0" cy="7" r="5" fill="#f5ffff"/>
    <path d="M-33 -21 L-48 17 M33 -21 L48 17 M-22 69 L-48 86 M22 69 L48 86" fill="none" stroke="#ddd2e5" stroke-width="6" stroke-linecap="round"/>
